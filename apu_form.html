{% extends "base.html" %}{% block content %}
<div class="head"><div><span class="pill">Nuevo APU</span><h1>Constructor de APU</h1><p>Define recursos y OBRAX calcula el precio de venta.</p></div></div>
<form method="post" action="/apus">
<section class="panel grid apuinfo"><div><label>Actividad</label><input name="name" required placeholder="Fabricación y montaje estructura metálica"></div><div><label>Unidad</label><input name="unit" value="kg" required></div><div><label>Administración %</label><input name="admin_pct" type="number" value="8" step=".01"></div><div><label>Imprevistos %</label><input name="conting_pct" type="number" value="2" step=".01"></div><div><label>Utilidad %</label><input name="util_pct" type="number" value="10" step=".01"></div></section>
<section class="panel"><div class="sectionhead"><h2>Recursos</h2><button type="button" class="btn" onclick="addRow()">+ Recurso</button></div><table id="items"><tr><th>Tipo</th><th>Recurso</th><th>Unidad</th><th>Cantidad</th><th>Desperdicio %</th><th>Precio unitario</th></tr><tr><td><select name="item_type[]"><option>Material</option><option>Mano de obra</option><option>Equipo</option><option>Herramienta</option></select></td><td><input name="item_name[]" placeholder="Acero A36, soldador..."></td><td><input name="item_unit[]" value="kg"></td><td><input name="item_qty[]" type="number" step=".0001" value="1"></td><td><input name="item_waste[]" type="number" step=".01" value="0"></td><td><input name="item_price[]" type="number" step=".01" value="0"></td></tr></table></section>
<div class="actions"><button class="btn primary">Guardar APU</button><a class="btn" href="/apus">Cancelar</a></div></form>
<script>function addRow(){let r=document.querySelector("#items tr:nth-child(2)").cloneNode(true);r.querySelectorAll("input").forEach(x=>{if(x.name.includes("unit"))x.value="kg";else if(x.name.includes("qty"))x.value="1";else if(x.name.includes("waste")||x.name.includes("price"))x.value="0";else x.value=""});document.querySelector("#items").appendChild(r)}</script>
{% endblock %}
