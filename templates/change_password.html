{% extends 'base.html' %}{% block content %}<div class="head"><div><span class="pill">SEGURIDAD</span><h1>Cambiar contraseña</h1><p>Actualiza la contraseña con la que ingresas a OBRAX.</p></div></div><section class="panel password-panel"><form method="post" autocomplete="off"><label>Contraseña actual<input type="password" name="current_password" autocomplete="current-password" required></label><label>Nueva contraseña<input type="password" name="new_password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required></label><label>Confirmar nueva contraseña<input type="password" name="confirm_password" minlength="6" autocomplete="new-password" required></label><button class="btn primary" type="submit">Guardar nueva contraseña</button></form></section><style>.password-panel{max-width:650px}.password-panel form{display:grid;gap:18px}.password-panel label{font-weight:800;color:#0c2340}.password-panel input{display:block;width:100%;box-sizing:border-box;margin-top:8px}</style>{% endblock %}
